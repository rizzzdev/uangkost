server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # --------------------------------------------------------------------------
    # Production Static File Serving for /uploads/ directly via Nginx
    # Zero-copy I/O (sendfile), caching headers, and script execution blocking
    # --------------------------------------------------------------------------
    location /uploads/ {
        alias /var/www/uangkost/uploads/;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff";

        location ~* \.(php|sh|pl|py|cgi|exe|js)$ {
            deny all;
            return 403;
        }

        try_files $uri =404;
    }

    # Reverse proxy ke API Backend Express container
    location /api/ {
        proxy_pass http://uangkost-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy ke SvelteKit Frontend container
    location / {
        proxy_pass http://uangkost-frontend:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
