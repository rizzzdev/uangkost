# ============================================================
# uangkost — Frontend (compose terpisah agar build tidak OOM)
#
# Prasyarat:
#   - Traefik berjalan di network external "proxy" (entrypoint
#     `websecure` + certresolver `myresolver` harus sudah ada)
#   - Network "backend" sudah dibuat:  docker network create backend
#   - Salin frontend/.env.example ke frontend/.env lalu sesuaikan
#     (PUBLIC_API_URL = URL publik API, COOKIE_DOMAIN = domain induk)
#
# Cara pakai (build & up SETELAH backend selesai):
#   docker compose -f compose-frontend.yaml build
#   docker compose -f compose-frontend.yaml up -d
#
# Domain Traefik bisa diubah via env var shell saat menjalankan compose:
#   DOMAIN_NAME=example.com docker compose -f compose-frontend.yaml up -d
# ============================================================

services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    # Satu sumber konfigurasi: frontend/.env (PUBLIC_API_URL & COOKIE_DOMAIN).
    # HOST/PORT/NODE_ENV adalah nilai khusus container yang tetap.
    env_file: ./frontend/.env
    environment:
      HOST: 0.0.0.0
      PORT: 4001
      NODE_ENV: production
    networks:
      - proxy
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.master-bn.rule=Host(`uangkost.${DOMAIN_NAME:-example.com}`)"
      - "traefik.http.routers.master-bn.entrypoints=websecure"
      - "traefik.http.routers.master-bn.tls.certresolver=myresolver"
      - "traefik.http.services.master-bn.loadbalancer.server.port=4001"

networks:
  proxy:
    external: true
  backend:
    external: true
