# ============================================================
# uangkost — Backend (compose terpisah agar build tidak OOM)
#
# Prasyarat:
#   - Traefik berjalan di network external "proxy" (entrypoint
#     `websecure` + certresolver `myresolver` harus sudah ada)
#   - Network "backend" sudah dibuat:  docker network create backend
#   - Salin backend/.env.example ke backend/.env lalu sesuaikan
#     (termasuk DATABASE_URL & REDIS_URL host nama service postgres/redis)
#
# Cara pakai (build satu-satu agar RAM tidak penuh):
#   docker compose -f compose-backend.yaml build
#   docker compose -f compose-backend.yaml up -d
#
# Domain Traefik bisa diubah via env var shell saat menjalankan compose:
#   DOMAIN_NAME=example.com docker compose -f compose-backend.yaml up -d
# ============================================================

services:
  backend:
    build: ./backend
    restart: unless-stopped
    # Satu sumber konfigurasi: backend/.env (aplikasi + DB/Redis + cookie domain).
    # NODE_ENV di-paksa production khusus container (mengabaikan value dev di .env).
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
    volumes:
      - uploads_data:/app/uploads
    networks:
      - proxy
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uangkost-api.rule=Host(`api.uangkost.${DOMAIN_NAME:-example.com}`)"
      - "traefik.http.routers.uangkost-api.entrypoints=websecure"
      - "traefik.http.routers.uangkost-api.tls.certresolver=myresolver"
      - "traefik.http.services.uangkost-api.loadbalancer.server.port=4000"

volumes:
  uploads_data:

networks:
  proxy:
    external: true
  backend:
    external: true
