# ============================================================
# uangkost — Docker Compose (Traefik + Backend + Frontend)
#
# Prasyarat:
#   - Traefik berjalan di network external "proxy" (entrypoint
#     `websecure` + certresolver `myresolver` harus sudah ada)
#   - Network "backend" sudah dibuat:  docker network create backend
#   - Salin .env.example (root) ke .env lalu sesuaikan nilainya
#
# Cara pakai:
#   docker compose up -d --build
# ============================================================

services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Koneksi DB/Redis yang dijangkau dari dalam container
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      NODE_ENV: production
      # CORS & link WA reminder (portal + laporan)
      PUBLIC_URL: ${PUBLIC_URL:-https://uangkost.${DOMAIN_NAME}}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - proxy
      - backend
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.uangkost-api.rule=Host(`api.uangkost.${DOMAIN_NAME}`)'
      - 'traefik.http.routers.uangkost-api.entrypoints=websecure'
      - 'traefik.http.routers.uangkost-api.tls.certresolver=myresolver'
      - 'traefik.http.services.uangkost-api.loadbalancer.server.port=4000'

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Dipakai browser & SSR — harus URL publik yang bisa diakses klien
      PUBLIC_API_URL: https://api.uangkost.${DOMAIN_NAME}/api
      HOST: 0.0.0.0
      PORT: 4001
    networks:
      - proxy
      - backend
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.master-bn.rule=Host(`uangkost.${DOMAIN_NAME}`)'
      - 'traefik.http.routers.master-bn.entrypoints=websecure'
      - 'traefik.http.routers.master-bn.tls.certresolver=myresolver'
      - 'traefik.http.services.master-bn.loadbalancer.server.port=4001'

volumes:
  uploads_data:

networks:
  proxy:
    external: true
  backend:
    external: true
