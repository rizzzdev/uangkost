services:
  # Nginx Internal Static File Server (Menyajikan /uploads/ secara zero-copy I/O di belakang Traefik)
  nginx:
    image: nginx:alpine
    container_name: uangkost-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/var/www/uangkost/uploads:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - proxy
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uangkost-uploads.rule=Host(`uangkost.${DOMAIN_NAME:-example.com}`) && PathPrefix(`/uploads`)"
      - "traefik.http.routers.uangkost-uploads.entrypoints=websecure"
      - "traefik.http.routers.uangkost-uploads.tls.certresolver=myresolver"
      - "traefik.http.routers.uangkost-uploads.priority=100"
      - "traefik.http.services.uangkost-uploads.loadbalancer.server.port=80"

  frontend:
    image: rizzzdev/uangkost:1.0.3
    container_name: uangkost-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 4001
      NODE_ENV: production
      TZ: Asia/Jakarta
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - proxy
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.master-bn.rule=Host(`uangkost.${DOMAIN_NAME:-example.com}`)"
      - "traefik.http.routers.master-bn.entrypoints=websecure"
      - "traefik.http.routers.master-bn.tls.certresolver=myresolver"
      - "traefik.http.routers.master-bn.priority=1"
      - "traefik.http.services.master-bn.loadbalancer.server.port=4001"

  backend:
    image: rizzzdev/api-uangkost:1.0.2
    container_name: uangkost-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TZ: Asia/Jakarta
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:4000/api/health\").then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - proxy
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uangkost-api.rule=Host(`api.uangkost.${DOMAIN_NAME:-example.com}`)"
      - "traefik.http.routers.uangkost-api.entrypoints=websecure"
      - "traefik.http.routers.uangkost-api.tls.certresolver=myresolver"
      - "traefik.http.services.uangkost-api.loadbalancer.server.port=4000"

volumes:
  uploads_data:

networks:
  proxy:
    external: true
  backend:
    external: true